services:
  ojs-db:
    build:
      context: .
      dockerfile: Dockerfile.db
    image: revista-ceibo-db:latest
    container_name: ojs_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ojs_db
      MYSQL_USER: ojs_user
      MYSQL_PASSWORD: ojs_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ojs-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ojs-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: revista-ceibo-app:latest
    container_name: ojs_app
    platform: linux/amd64
    restart: always
    ports:
      - "8080:80"
    depends_on:
      ojs-db:
        condition: service_healthy
    networks:
      - ojs-net

volumes:
  db_data:

networks:
  ojs-net:
    driver: bridge